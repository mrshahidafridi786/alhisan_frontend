    <!-- Primary SEO Meta Tags -->
    <title>Alhisan Trading Company | International Trading — Abu Dhabi, UAE</title>
    <meta name="description" content="Alhisan is an international trading company based in Abu Dhabi, UAE, dealing in essential industrial commodities, food products, spices, salt, soda ash, and calcium carbonate." />

    <link rel="canonical" href="https://alhisan.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <!-- Twitter -->

    <!-- Immediate Theme Initialization to avoid white flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('alhisan-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: Manrope (Headings) and Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
